name: 构建公开发布附件
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查标签与版本
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: 安装测试依赖
        run: python -m pip install -r requirements-optional.txt
      - name: 自动化测试
        run: python -m unittest discover -s tests -v
      - name: 校验并构建
        run: python scripts/build_release.py
      - name: 发布GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/SHA256SUMS.txt dist/build-manifest.json
          --verify-tag
          --title "中华民族祝福票 $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
